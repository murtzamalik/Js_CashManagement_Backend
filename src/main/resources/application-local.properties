length.rrn = 9

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.ws.client.MessageTracing.sent=DEBUG
logging.level.org.springframework.ws.server.MessageTracing.sent=DEBUG
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE
logging.level.org.springframework.ws.server.MessageTracing.received=TRACE

# Plain T24 mock (run t24-mock-service on port 18080) — optional when in-process mock is on
jcash.t24.base-url=http://localhost:18080
# true = never call remote T24; use in-process mock (safe until real IBFT API is ready)
jcash.t24.mock-enabled=true
# if live call fails, still return mock (only applies when mock-enabled=false)
jcash.t24.mock-fallback-on-error=true

# CMS mock workflow (maker-checker-release) — in-memory store for demo
jcash.workflow.mock-enabled=true
jcash.workflow.scheduler-cron-enabled=false
