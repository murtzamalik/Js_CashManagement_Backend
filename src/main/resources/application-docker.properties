server.port=8020
server.servlet.context-path=/jscash

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@host.docker.internal:1521/ORCLPDB1}
spring.datasource.username=${DB_USERNAME:JS_CASH}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

logging.level.org.hibernate.SQL=info
logging.level.org.springframework.web=INFO

length.rrn=9

# T24 mock service (docker compose service name)
jcash.t24.base-url=${T24_BASE_URL:http://t24-mock:18080}
